[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "witness_register"
version = "0.3.1"
description = "A shared witness register: co-registration of line report envelopes without aggregation"
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.ruff]
# Keep syntax guidance aligned with the metadata-declared Python 3.11 floor.
# Historical runs on older interpreters are not current support evidence.
target-version = "py311"

[tool.ruff.lint]
# Ruff's default set: pyflakes plus the syntax and logic subset of pycodestyle.
# Line length and import ordering are deliberately not enforced, matching the
# sibling line repositories' pinned configuration.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
